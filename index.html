         por ruta en src/router/index.ts (metaPorRuta). Aquí va solo el
         valor de la portada, que es lo que lee un crawler sin JS. -->

    <meta name="description" content="Andersson Boscán y Mónica Velásquez, periodistas de investigación. 35 expedientes sobre corrupción y crimen organizado en Ecuador, y publicidad sin reunión: arma tu campaña en minutos." />
